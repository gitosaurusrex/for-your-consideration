# Sveltia CMS configuration — https://sveltiacms.app/en/docs
#
# Every entry is a JSON file in /content. Each file holds both languages:
#   { "en": { ... }, "ja": { ... } }
# Fields marked `i18n: true` are written separately for each language;
# fields marked `i18n: duplicate` are entered once and copied to both.

backend:
  name: github
  repo: gitosaurusrex/for-your-consideration
  branch: main

media_folder: public/uploads
public_folder: /uploads

# Set this to your live site URL once deployed (enables "View on site" links).
# site_url: https://your-site.example
logo:
  src: /favicon.svg

i18n:
  structure: single_file
  locales: [en, ja]
  default_locale: en

collections:
  # ───────────────────────────── Films & TV ─────────────────────────────
  - name: titles
    label: Films & TV
    label_singular: Film or show
    folder: content/titles
    format: json
    create: true
    i18n: true
    slug: "{{title}}"
    identifier_field: title
    summary: "{{title}} ({{year}}) · {{kind}}"
    sortable_fields: [title, year, added]
    view_groups:
      - { label: Type, field: kind }
    fields:
      - { name: title, label: Title, widget: string, i18n: true, hint: "Use the official Japanese release title for the 日本語 version." }
      - { name: kind, label: Type, widget: select, i18n: duplicate, options: [{ label: Film, value: film }, { label: TV show, value: tv }], default: film }
      - { name: year, label: Release year, widget: number, value_type: int, i18n: duplicate }
      - name: countries
        label: Release countries
        widget: select
        multiple: true
        i18n: duplicate
        hint: Names are translated automatically on the site.
        options: &countries
          - { label: "🇺🇸 United States", value: US }
          - { label: "🇬🇧 United Kingdom", value: GB }
          - { label: "🇯🇵 Japan", value: JP }
          - { label: "🇰🇷 South Korea", value: KR }
          - { label: "🇫🇷 France", value: FR }
          - { label: "🇩🇪 Germany", value: DE }
          - { label: "🇮🇹 Italy", value: IT }
          - { label: "🇪🇸 Spain", value: ES }
          - { label: "🇨🇦 Canada", value: CA }
          - { label: "🇦🇺 Australia", value: AU }
          - { label: "🇳🇿 New Zealand", value: NZ }
          - { label: "🇮🇪 Ireland", value: IE }
          - { label: "🇲🇽 Mexico", value: MX }
          - { label: "🇧🇷 Brazil", value: BR }
          - { label: "🇦🇷 Argentina", value: AR }
          - { label: "🇨🇳 China", value: CN }
          - { label: "🇭🇰 Hong Kong", value: HK }
          - { label: "🇹🇼 Taiwan", value: TW }
          - { label: "🇮🇳 India", value: IN }
          - { label: "🇹🇭 Thailand", value: TH }
          - { label: "🇸🇪 Sweden", value: SE }
          - { label: "🇳🇴 Norway", value: NO }
          - { label: "🇩🇰 Denmark", value: DK }
          - { label: "🇳🇱 Netherlands", value: NL }
          - { label: "🇧🇪 Belgium", value: BE }
          - { label: "🇵🇱 Poland", value: PL }
          - { label: "🇮🇷 Iran", value: IR }
          - { label: "🇹🇷 Türkiye", value: TR }
          - { label: "🇿🇦 South Africa", value: ZA }
          - { label: "🇳🇬 Nigeria", value: NG }
          - { label: "🇯🇲 Jamaica", value: JM }
          - { label: "🇮🇸 Iceland", value: IS }
      - { name: poster, label: Poster (official art), widget: image, i18n: duplicate, required: false, hint: "Upload an image or paste a URL (e.g. from TMDB). Leave empty and run `npm run fetch-art` to fill it automatically." }
      - { name: backdrop, label: Backdrop (wide still), widget: image, i18n: duplicate, required: false }
      - { name: summary, label: Spoiler-free summary, widget: text, i18n: true }
      - { name: note, label: "Why I recommend it (personal note)", widget: text, i18n: true, required: false }
      - name: directors
        label: Director(s) — or creator(s) for TV
        widget: relation
        collection: people
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        multiple: true
        i18n: duplicate
      - name: cast
        label: Top-billed cast
        widget: relation
        collection: people
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        multiple: true
        i18n: duplicate
        required: false
      - name: genres
        label: Genres
        widget: relation
        collection: genres
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        multiple: true
        i18n: duplicate
      - { name: runtime, label: "Runtime (minutes, films only)", widget: number, value_type: int, required: false, i18n: duplicate }
      - { name: watch_service, label: Where to watch (e.g. Netflix), widget: string, required: false, i18n: duplicate }
      - { name: watch_url, label: Watch link, widget: string, type: url, required: false, i18n: duplicate }
      - { name: trailer_url, label: Trailer link, widget: string, type: url, required: false, i18n: duplicate }
      - { name: tmdb_id, label: "TMDB ID (optional, helps fetch-art)", widget: string, required: false, i18n: duplicate }
      - { name: featured, label: Feature on home page, widget: boolean, default: false, i18n: duplicate }
      - { name: added, label: Date added, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", default: "{{now}}", i18n: duplicate }

  # ──────────────────────────────── Music ────────────────────────────────
  - name: music
    label: Music
    label_singular: Song or album
    folder: content/music
    format: json
    create: true
    i18n: true
    slug: "{{title}}"
    identifier_field: title
    summary: "{{title}} ({{year}}) · {{kind}}"
    sortable_fields: [title, year, added]
    view_groups:
      - { label: Type, field: kind }
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: kind, label: Type, widget: select, i18n: duplicate, options: [{ label: Song, value: song }, { label: Album, value: album }], default: song }
      - name: artists
        label: Artist(s)
        widget: relation
        collection: people
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        multiple: true
        i18n: duplicate
      - { name: album, label: From the album (songs only), widget: string, required: false, i18n: true }
      - { name: year, label: Release year, widget: number, value_type: int, i18n: duplicate }
      - { name: countries, label: Release countries, widget: select, multiple: true, i18n: duplicate, options: *countries }
      - { name: cover, label: Cover art, widget: image, i18n: duplicate, required: false, hint: "Upload or paste a URL. Leave empty and run `npm run fetch-art` to pull it from Spotify." }
      - { name: summary, label: Spoiler-free summary / vibe, widget: text, i18n: true }
      - { name: note, label: Personal note, widget: text, i18n: true, required: false }
      - name: genres
        label: Genres
        widget: relation
        collection: genres
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        multiple: true
        i18n: duplicate
      - { name: spotify_url, label: Spotify link, widget: string, type: url, required: false, i18n: duplicate }
      - { name: video_url, label: Music video link, widget: string, type: url, required: false, i18n: duplicate }
      - { name: featured, label: Feature on home page, widget: boolean, default: false, i18n: duplicate }
      - { name: added, label: Date added, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", default: "{{now}}", i18n: duplicate }

  # ──────────────────────────────── People ───────────────────────────────
  - name: people
    label: People
    label_singular: Person
    description: Directors, actors and musicians. Linking the same person from several entries connects them on the site.
    folder: content/people
    format: json
    create: true
    i18n: true
    slug: "{{name}}"
    identifier_field: name
    fields:
      - { name: name, label: Name, widget: string, i18n: true, hint: "Japanese version: the katakana name used in Japan (e.g. ドゥニ・ヴィルヌーヴ)." }
      - { name: photo, label: Photo, widget: image, required: false, i18n: duplicate }

  # ──────────────────────────────── Genres ───────────────────────────────
  - name: genres
    label: Genres
    label_singular: Genre
    folder: content/genres
    format: json
    create: true
    i18n: true
    slug: "{{name}}"
    identifier_field: name
    fields:
      - { name: name, label: Name, widget: string, i18n: true }
      - { name: hue, label: "Colour hue (0–360)", widget: number, value_type: int, min: 0, max: 360, default: 200, i18n: duplicate, hint: "0 red · 45 orange · 130 green · 200 blue · 270 purple · 330 pink" }

  # ────────────────────────────── Site text ──────────────────────────────
  - name: settings
    label: Site text
    i18n: true
    files:
      - name: site
        label: Home page greeting
        file: content/site.json
        format: json
        i18n: true
        fields:
          - { name: greeting, label: Greeting, widget: string, i18n: true }
          - { name: intro, label: Intro paragraph, widget: text, i18n: true }
          - { name: signoff, label: Sign-off, widget: string, i18n: true }
